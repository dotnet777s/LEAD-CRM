{% extends "captacao/base.html" %}
{% block title %}TopCar · Minha conta{% endblock %}
{% block titulo %}Minha conta{% endblock %}
{% block content %}
<div class="pg" style="max-width:560px">
  <div class="titulo-pg"><div><h1>Minha conta</h1><small>Usuário: {{ request.user.username }}</small></div></div>
  {% if msg %}<p class="ok-msg">{{ msg }}</p>{% endif %}
  <form method="post" class="box cfg">{% csrf_token %}
    <label class="l">Nome<input type="text" name="first_name" value="{{ request.user.first_name }}" maxlength="60"></label>
    <label class="l">Sobrenome<input type="text" name="last_name" value="{{ request.user.last_name }}" maxlength="60"></label>
    <label class="l">E-mail<input type="email" name="email" value="{{ request.user.email }}" maxlength="120"></label>
    <button class="btn" style="margin-top:10px">Salvar</button></form>
  <p style="margin-top:12px"><a class="btn sec" href="{% url 'captacao:senha' %}">Trocar a senha</a></p>
</div>
{% endblock %}
