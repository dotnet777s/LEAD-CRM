<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TopCar · Entrar</title>{% load static %}<link rel="icon" href="{% static 'captacao/favicon.png' %}">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080808;color:#ededed;font-family:Inter,system-ui,sans-serif}
form{background:#141414;border:1px solid #2e2e2e;border-radius:14px;padding:28px;width:min(92vw,340px);display:grid;gap:12px}
img{height:40px;justify-self:center}
input{padding:12px;border-radius:8px;border:1px solid #2e2e2e;background:#080808;color:#ededed;font-size:16px}
button{padding:12px;border:0;border-radius:8px;background:#22c55e;color:#04210f;font-weight:700;font-size:16px}
.e{color:#ef5350;font-size:14px}
</style></head>
<body><form method="post">{% csrf_token %}<img src="{% static 'captacao/logo.png' %}" alt="TopCar">
{% if form.errors %}<div class="e">Usuário ou senha incorretos.</div>{% endif %}
<input name="username" placeholder="Usuário" autofocus autocomplete="username">
<input name="password" type="password" placeholder="Senha" autocomplete="current-password">
<input type="hidden" name="next" value="{{ next }}"><button>Entrar</button></form></body></html>
